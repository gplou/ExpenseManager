name: expense_manager
description: App de productividad y gestión - MVP
publish_to: 'none'
version: 1.0.4+43

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.4

  # Estado
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navegación
  go_router: ^17.0.0

  # Modelos
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1

  # Conectividad
  connectivity_plus: ^7.0.0

  # Storage local
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  path: ^1.9.0

  # Bloqueo biométrico (app lock)
  local_auth: ^2.3.0

  # Ads
  google_mobile_ads: ^8.0.0
  app_tracking_transparency: ^2.0.6+1

  # RevenueCat (IAP + subscription management)
  purchases_flutter: ^10.0.0

  # Analytics
  posthog_flutter: ^5.0.0
  package_info_plus: ^8.3.1
  sentry_flutter: ^9.0.0

  # Charts
  fl_chart: ^1.2.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Social auth
  google_sign_in: ^7.0.0
  sign_in_with_apple: ^7.0.0
  crypto: ^3.0.2

  # Voz + IA
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # Exportación
  excel: ^4.0.6
  share_plus: ^12.0.0
  path_provider: ^2.1.4

  # Backup / import (A4)
  file_picker: ^10.1.0
  csv: ^6.0.0

  # Notificaciones locales de recurrentes (A5)
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

  # Widgets de pantalla de inicio
  home_widget: ^0.9.0

  # Utilidades
  intl: ^0.20.2
  clock: ^1.1.1
  synchronized: ^3.4.0
  gap: ^3.0.1
  flutter_native_splash: ^2.4.1
  sqflite_sqlcipher: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.2.0   # solo test/helpers/mocks.dart
  sqflite_common_ffi: ^2.3.2+1
  flutter_launcher_icons: ^0.14.1
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  mock_supabase_http_client: ^0.0.3+2
  integration_test:
    sdk: flutter

  # Generación de código
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.7.1
  riverpod_generator: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Light.ttf
          weight: 300
        - asset: assets/fonts/GeneralSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.ttf
          weight: 700
