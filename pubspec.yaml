name: productivity_app
description: App de productividad y gestión - MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.4

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.5.1

  # Navegación
  go_router: ^13.2.0

  # Modelos
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Storage local
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.69.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Social auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.2

  # Voz + IA
  speech_to_text: ^7.0.0
  http: ^1.2.0

  # Utilidades
  intl: ^0.20.2
  equatable: ^2.0.5
  logger: ^2.3.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Generación de código
  build_runner: 2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
