name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # If the project later pins a specific Flutter version in .fvmrc, change
  # this to that exact string (e.g. "3.32.0") for reproducible CI builds.
  FLUTTER_VERSION: stable

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `String.fromEnvironment` reads happen at compile time, so analyze
      # works without real secrets; tests use a stub dart_defines file
      # so AppConfig.validate() doesn't trip in CI.
      - name: Create stub dart_defines.json for CI
        run: |
          cat > dart_defines.json <<'EOF'
          {
            "SUPABASE_URL": "https://ci.example.com",
            "SUPABASE_ANON_KEY": "ci-fake-anon-key",
            "GOOGLE_WEB_CLIENT_ID": "ci-fake-google",
            "REVENUECAT_ANDROID_KEY": "ci-fake-rc-android",
            "REVENUECAT_IOS_KEY": "ci-fake-rc-ios",
            "POSTHOG_API_KEY": "ci-fake-posthog"
          }
          EOF

      - name: Generate code (build_runner + l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Compute filtered coverage report
        id: coverage
        run: |
          # Reuse the same exclusion logic as tool/coverage.sh — keep them in sync.
          awk '
            BEGIN { record=""; skip=0 }
            /^SF:/ {
              record = $0 "\n"
              skip = 0
              if ($0 ~ /\.g\.dart$/) skip = 1
              else if ($0 ~ /\.freezed\.dart$/) skip = 1
              else if ($0 ~ /\/l10n\/app_localizations.*\.dart$/) skip = 1
              else if ($0 ~ /\/lib\/main\.dart$/) skip = 1
              else if ($0 ~ /\/lib\/firebase_options\.dart$/) skip = 1
              next
            }
            /^end_of_record/ {
              record = record $0 "\n"
              if (!skip) printf "%s", record
              record = ""
              skip = 0
              next
            }
            { record = record $0 "\n" }
          ' coverage/lcov.info > coverage/lcov_filtered.info

          PCT=$(awk -F: '
            /^DA:/ {
              split($2, a, ",")
              found++
              if (a[2] > 0) hit++
            }
            END {
              if (found > 0) printf "%.2f", (hit/found)*100
              else print "0.00"
            }
          ' coverage/lcov_filtered.info)

          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Filtered coverage: $PCT%"

      # Coverage gate.
      # Threshold is intentionally just below the current value so the
      # green build catches regressions without blocking merges every
      # time we add untested code. Raise it as new test phases land.
      - name: Enforce coverage threshold (55%)
        run: |
          PCT="${{ steps.coverage.outputs.pct }}"
          THRESHOLD=55.0
          awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN {
            if (p+0 < t+0) {
              printf "Coverage %s%% is below threshold %s%%\n", p, t
              exit 1
            }
            printf "Coverage %s%% meets threshold %s%%\n", p, t
          }'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov_filtered.info
          retention-days: 14
